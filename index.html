<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJPHARM-SERCH🔍</title>
    
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        :root {
            --primary: #2563EB; 
            --primary-light: #EFF6FF; 
            --bg: #FFFFFF; 
            --text: #1E293B; 
            --text-light: #64748B; 
            --border: #E2E8F0;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%); 
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 12vh; 
            margin: 0;
            letter-spacing: -0.01em;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0F172A;
            margin-top: 0;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 0;
            font-weight: 500;
        }

        .search-container {
            width: 100%;
            max-width: 540px;
            position: relative;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            color: #94A3B8;
            pointer-events: none;
        }

        .search-input {
            width: 100%; 
            padding: 1.2rem 1.5rem 1.2rem 3.2rem; 
            border: 2px solid #DBEAFE; 
            border-radius: 16px; 
            font-size: 1.15rem; 
            box-sizing: border-box; 
            background-color: var(--bg); 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1); 
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .search-input:disabled {
            background-color: #F1F5F9;
            border-color: #CBD5E1;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .notice-box {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #B91C1C;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            margin-top: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.05);
        }

        /* 🌟 드롭다운을 검색창 영역 안으로 종속시키고 넓이를 딱 맞췄습니다 */
        .autocomplete-list { 
            position: absolute; 
            top: calc(100% + 8px); 
            left: 0; 
            right: 0; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            z-index: 1000; 
            max-height: 400px; 
            overflow-y: auto; 
            display: none; 
            box-shadow: var(--shadow-xl); /* 그림자를 더 진하게 해서 붕 떠보이게 만듦 */
            padding: 0; 
            margin: 0; 
            list-style: none; 
            border-radius: 12px; 
        }

        .autocomplete-list li { 
            padding: 16px 20px; 
            cursor: pointer; 
            border-bottom: 1px dashed var(--border); 
            transition: background 0.2s;
        }
        
        .autocomplete-list li:last-child { border-bottom: none; }
        .autocomplete-list li:hover { background-color: var(--primary-light); }

        .prod-name { font-size: 1.1rem; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
        .prod-meta { font-size: 0.8rem; color: #94A3B8; margin-bottom: 8px; font-weight: 500; }
        .prod-info { font-size: 0.9rem; color: var(--primary); font-weight: 700; background: #DBEAFE; display: inline-block; padding: 4px 10px; border-radius: 6px; }
        
        .footer {
            margin-top: auto;
            padding: 2rem;
            color: #CBD5E1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="main-title">🏢 티제이팜 담당자 검색기</h1>
        <p class="sub-title">
            제조사와 실제 유통사가 달라서 헷갈리시나요?<br>
            <strong style="color: var(--primary);">실제 매입처</strong>와 <strong style="color: var(--primary);">담당자</strong>를 1초 만에 확인하세요!
        </p>
    </div>

    <div class="search-container">
        <div class="input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="데이터를 불러오는 중입니다..." disabled autocomplete="off">
            
            <!-- 🌟 드롭다운 리스트(<ul id="search-list">)를 이 위치로 올렸습니다! -->
            <ul id="search-list" class="autocomplete-list"></ul>
        </div>
        
        <div class="notice-box">
            <span style="font-size: 1.3rem; margin-top: 2px;">⚠️</span>
            <div>
                <div style="margin-bottom: 8px;">본 검색기는 <strong>'매입처'</strong> 기준으로 담당자가 매칭됩니다.</div>
                <div style="color: #7F1D1D; font-size: 0.85rem; line-height: 1.6;">
                    일반의약품 검색 시 전문의약품 담당자가 표시될 수 있으므로,<br>
                    <strong>일반약 관련 문의는 전문 담당자에게 삼가주시기 바랍니다.</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        TJPHARM Integrated System
    </div>

    <script>
        let productsData = []; 
        let suppliersData = []; 
        let managersData = []; 

        function formatCode3(code) { 
            return code && /^\d+$/.test(code.trim()) ? code.trim().padStart(3, '0') : (code || ""); 
        }
        function cleanCompanyName(name) { 
            return name ? name.replace(/\(주\)/g, '').replace(/\(유\)/g, '').replace(/주식회사/g, '').trim() : ""; 
        }

        async function loadData() {
            try {
                const res = await fetch('https://tjpharm2038-api.yellowcuppy.workers.dev/?action=getAll'); 
                const data = await res.json();
                
                productsData = data.products || []; 
                suppliersData = data.suppliers || []; 
                managersData = data.managers || []; 

                const input = document.getElementById('search-input');
                input.placeholder = "제품명 또는 코드 입력 (예: 듀락칸)";
                input.disabled = false;
                input.focus();
            } catch (e) {
                console.error("데이터 로딩 실패:", e);
                document.getElementById('search-input').placeholder = "데이터를 불러오지 못했습니다.";
            }
        }

        document.getElementById('search-input').addEventListener('input', function() {
            const val = this.value.trim().toLowerCase().replace(/\^/g, ' '); 
            const list = document.getElementById('search-list');
            list.innerHTML = ''; 

            if (!val) { 
                list.style.display = 'none'; 
                return; 
            }

            const searchTerms = val.split(/\s+/).filter(t => t.length > 0); 

            const matches = productsData.filter(item => {
                if (!item || !item.standardCode || String(item.standardCode).trim() === "") return false;
                const combinedStr = `${item.name} ${item.code} ${item.spec}`.toLowerCase();
                return searchTerms.every(term => combinedStr.includes(term));
            }).slice(0, 50);

            if (matches.length > 0) {
                matches.forEach(item => {
                    let sName = "-"; let mName = "-"; 
                    if (item.seller) { 
                        const dCode = formatCode3(item.seller); 
                        
                        const sup = suppliersData.find(s => formatCode3(s.code) === dCode); 
                        sName = sup ? cleanCompanyName(sup.name) : `미등록(${dCode})`; 
                        
                        const mgr = managersData.find(m => formatCode3(m.code) === dCode); 
                        mName = mgr ? mgr.name : `미등록(${dCode})`; 
                    } 

                    const li = document.createElement('li');
                    li.onclick = function() {
                        document.getElementById('search-input').value = item.name;
                        list.style.display = 'none';
                    };

                    li.innerHTML = `
                        <div class="prod-name">${item.name}</div>
                        <div class="prod-meta">코드: ${item.code} | 규격: ${item.spec || '-'}</div>
                        <div class="prod-info">🏢 ${sName} &nbsp;|&nbsp; 👨‍💼 ${mName}</div>
                    `;
                    list.appendChild(li);
                });
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            const input = document.getElementById('search-input');
            const list = document.getElementById('search-list');
            if (e.target !== input && e.target !== list && !list.contains(e.target)) {
                list.style.display = 'none';
            }
        });

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
