<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJPHARM-SEARCH🔍</title>
    
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        :root {
            --primary: #2563EB; 
            --primary-light: #EFF6FF; 
            --bg: #FFFFFF; 
            --text: #1E293B; 
            --text-light: #64748B; 
            --border: #E2E8F0;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%); 
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 12vh; 
            margin: 0;
            letter-spacing: -0.01em;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0F172A;
            margin-top: 0;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 0;
            font-weight: 500;
        }

        .search-container {
            width: 100%;
            max-width: 540px;
            position: relative;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            color: #94A3B8;
            pointer-events: none;
        }

        .search-input {
            width: 100%; 
            padding: 1.2rem 1.5rem 1.2rem 3.2rem; 
            border: 2px solid #DBEAFE; 
            border-radius: 16px; 
            font-size: 1.15rem; 
            box-sizing: border-box; 
            background-color: var(--bg); 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1); 
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .search-input:disabled {
            background-color: #F1F5F9;
            border-color: #CBD5E1;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .notice-box {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #B91C1C;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            margin-top: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.05);
        }

        .autocomplete-list { 
            position: absolute; 
            top: calc(100% + 8px); 
            left: 0; 
            right: 0; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            z-index: 1000; 
            max-height: 400px; 
            overflow-y: auto; 
            display: none; 
            box-shadow: var(--shadow-xl); 
            padding: 0; 
            margin: 0; 
            list-style: none; 
            border-radius: 12px; 
        }

        .autocomplete-list li { 
            padding: 16px 20px; 
            cursor: pointer; 
            border-bottom: 1px dashed var(--border); 
            transition: background 0.2s;
        }
        
        .autocomplete-list li:last-child { border-bottom: none; }
        .autocomplete-list li:hover { background-color: var(--primary-light); }

        .prod-name { font-size: 1.1rem; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
        .prod-meta { font-size: 0.8rem; color: #94A3B8; margin-bottom: 8px; font-weight: 500; }
        .prod-info { font-size: 0.9rem; color: var(--primary); font-weight: 700; background: #DBEAFE; display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; }
        
        .footer {
            margin-top: auto;
            padding: 2rem;
            color: #CBD5E1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* 🌟 검색기 전용 공문 보기 버튼 스타일 */
        .notice-btn {
            display: inline-flex; align-items: center; gap: 4px;
            background: #FFFBEB; color: #D97706; border: 1px solid #F59E0B;
            padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; text-decoration: none; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-left: 8px; vertical-align: middle;
        }
        .notice-btn:hover { background: #FEF3C7; transform: translateY(-1px); }

        /* 🌟 검색기 전용 제약사회수 버튼 스타일 */
        .recall-btn {
            display: inline-flex; align-items: center; gap: 4px;
            background: #FFF1F2; color: #E11D48; border: 1px solid #F43F5E;
            padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; text-decoration: none; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-left: 6px; vertical-align: middle;
        }
        .recall-btn:hover { background: #FFE4E6; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="main-title">🏬티제이팜 담당자 검색기💊</h1>
        <p class="sub-title">
            제조사와 실제 유통사가 달라서 헷갈리시나요?<br>
            <strong style="color: var(--primary);">실제 매입처</strong>와 <strong style="color: var(--primary);">담당자</strong>를 1초 만에 확인하세요!
        </p>
        <div style="margin-top: 12px; padding: 0 10px;">
            <div style="display: inline-block; font-size: 0.85rem; color: #1D4ED8; background-color: #DBEAFE; padding: 8px 16px; border-radius: 12px; font-weight: 700; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1); line-height: 1.5; word-break: keep-all;">
                💡 검색된 [👨‍💼 이름 💬] 버튼을 누르면<br>팀즈 1:1 채팅이 열립니다!
            </div>
        </div>
    </div>

    <div class="search-container">
        <div class="input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="데이터를 불러오는 중입니다..." disabled autocomplete="off">
            <ul id="search-list" class="autocomplete-list"></ul>
        </div>
        
        <div class="notice-box">
            <span style="font-size: 1.3rem; margin-top: 2px;">⚠️</span>
            <div>
                <div style="margin-bottom: 8px;">본 검색기는 <strong>'매입처'</strong> 기준으로 담당자가 매칭됩니다.</div>
                <div style="color: #7F1D1D; font-size: 0.85rem; line-height: 1.6;">
                    일반의약품 검색 시 전문의약품 담당자가 표시될 수 있으므로,<br>
                    <strong>일반약 관련 문의는 전문 담당자에게 삼가주시기 바랍니다.</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        TJPHARM SEARCH SYSTEM
    </div>

    <!-- 🌟 담당자 검색기 전용 공문 & 회수 통합 확대 팝업 모달 -->
    <div id="notice-search-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(3px);" onclick="closeNoticeSearchPopup()">
        <div style="background:white; padding:24px; border-radius:16px; width:90%; max-width:720px; max-height:90vh; display:flex; flex-direction:column; align-items:center; position:relative; box-shadow:0 25px 50px -12px rgb(0 0 0 / 0.25); overflow-y:auto; box-sizing:border-box;" onclick="event.stopPropagation()">
            <button onclick="closeNoticeSearchPopup()" style="position:absolute; top:12px; right:12px; width:auto; padding:6px 14px; background:#CBD5E1; color:white; border-radius:6px; font-weight:bold; border:none; cursor:pointer;">닫기 ✖</button>
            <h3 id="notice-modal-title" style="margin:0 0 15px 0; font-size:1.15rem; color:#1E293B; width:100%; text-align:left; padding-right:70px; box-sizing:border-box;">📢 제약사 공문 내용</h3>
            
            <!-- 🌟 회수 공문 클릭 시에만 나타나는 상단 요약 텍스트 박스 -->
            <div id="notice-modal-body" style="display:none; background:#FFF1F2; padding:16px 18px; border-radius:12px; border:1px solid #FECDD3; font-size:0.92rem; line-height:1.75; color:#1E293B; margin-bottom:16px; width:100%; box-sizing:border-box; text-align:left;"></div>

            <div style="overflow:auto; max-width:100%; max-height:70vh; display:flex; justify-content:center; width:100%;">
                <!-- 🌟 [추가] cursor:zoom-in; 와 onclick 이벤트 추가 -->
                <img id="notice-modal-img" src="" style="max-width:100%; height:auto; object-fit:contain; border-radius:8px; border:1px solid #E2E8F0; cursor:zoom-in;" onclick="openImageZoomPopup(this.src)" title="클릭하면 이미지가 원본 크기로 확대됩니다">
            </div>
        </div>
    </div>

    <!-- 🌟 [추가] 이미지 클릭 시 원본 크기로 꽉 차게 보여주는 확대 모달 🌟 -->
    <div id="image-zoom-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999999; align-items:center; justify-content:center; backdrop-filter:blur(5px); padding:20px; box-sizing:border-box;" onclick="closeImageZoomPopup()">
        <button onclick="closeImageZoomPopup()" style="position:absolute; top:20px; right:20px; width:auto; padding:8px 16px; background:#CBD5E1; color:#1E293B; border-radius:8px; font-weight:800; font-size:1rem; border:none; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.3); z-index:1000000;">닫기 ✖</button>
        <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:auto;">
            <img id="image-zoom-img" src="" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; box-shadow:0 0 20px rgba(0,0,0,0.5); cursor:zoom-out;" onclick="event.stopPropagation(); closeImageZoomPopup();">
        </div>
    </div>

    <script>
        let productsData = []; 
        let suppliersData = []; 
        let managersData = []; 
        let outOfStockData = []; 
        let entries = []; 
        let noticeEntries = []; 
        let recallEntries = []; 

        const isTrue = (val) => val === 1 || val === true || val === 'true';

        function getOOSInfo(pCode) {
            if (!pCode) return null;
            const targetCode = String(pCode).trim().padStart(6, '0');

            const manualOos = entries.find(e => e.boardType === 'oos' && String(e.pCode).trim().padStart(6, '0') === targetCode && !isTrue(e.del));
            if (manualOos) {
                return { status: manualOos.vCode || "품절", schedule: manualOos.vName || "미정", remark: manualOos.regReason || "" };
            }

            const isDeletedExcel = entries.find(e => e.boardType === 'oos_del' && String(e.pCode).trim().padStart(6, '0') === targetCode && isTrue(e.del));
            if (!isDeletedExcel) {
                const excelOos = outOfStockData.find(o => String(o.code).trim().padStart(6, '0') === targetCode);
                if (excelOos) {
                    return { status: excelOos.status || "품절", schedule: excelOos.schedule || "미정", remark: excelOos.remark || "" };
                }
            }
            return null;
        }

        function formatCode3(code) { 
            return code && /^\d+$/.test(code.trim()) ? code.trim().padStart(3, '0') : (code || ""); 
        }
        function cleanCompanyName(name) { 
            return name ? name.replace(/\(주\)/g, '').replace(/\(유\)/g, '').replace(/주식회사/g, '').trim() : ""; 
        }

        async function loadData() {
            try {
                const res = await fetch('https://tjpharm2038-api.yellowcuppy.workers.dev/?action=getAll');
                const data = await res.json();
                
                productsData = data.products || []; 
                suppliersData = data.suppliers || []; 
                managersData = data.managers || []; 
                outOfStockData = data.outofstock || [];
                entries = data.entries || [];
                
                noticeEntries = (data.entries || []).filter(e => e.boardType === 'notice' && !isTrue(e.del));
                recallEntries = (data.entries || []).filter(e => e.boardType === 'recall' && !isTrue(e.del));

                const input = document.getElementById('search-input');
                input.placeholder = "제품명 또는 코드 입력 (예: 듀락칸)";
                input.disabled = false;
                input.focus();
            } catch (e) {
                console.error("데이터 로딩 실패:", e);
                document.getElementById('search-input').placeholder = "데이터를 불러오지 못했습니다.";
            }
        }

        document.getElementById('search-input').addEventListener('input', function() {
            const val = this.value.trim().toLowerCase().replace(/\^/g, ' '); 
            const list = document.getElementById('search-list');
            list.innerHTML = ''; 

            if (!val) { 
                list.style.display = 'none'; 
                return; 
            }

            const searchTerms = val.split(/\s+/).filter(t => t.length > 0); 

            let matches = productsData.filter(item => {
                if (!item || !item.standardCode || String(item.standardCode).trim() === "") return false;
                
                const code = String(item.code || '').toLowerCase();
                const name = String(item.name || '').toLowerCase();
                const spec = String(item.spec || '').toLowerCase();

                return searchTerms.every(term => 
                    code.startsWith(term) ||
                    name.includes(term) ||
                    spec.includes(term)
                );
            });

            if (searchTerms.length > 0) {
                const primaryTerm = searchTerms[0];
                matches.sort((a, b) => {
                    const nameA = String(a.name || '').toLowerCase();
                    const nameB = String(b.name || '').toLowerCase();
                    
                    const idxA = nameA.indexOf(primaryTerm);
                    const idxB = nameB.indexOf(primaryTerm);

                    if (idxA !== -1 && idxB !== -1) {
                        if (idxA !== idxB) return idxA - idxB; 
                        return nameA.length - nameB.length;    
                    }
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return 0;
                });
            }

            matches = matches.slice(0, 50);

            if (matches.length > 0) {
                matches.forEach(item => {
                    let sName = "-"; 
                    let mNameHtml = "👨‍💼 -"; 

                    if (item.seller) { 
                        const dCode = formatCode3(item.seller); 
                        
                        const sup = suppliersData.find(s => formatCode3(s.code) === dCode); 
                        sName = sup ? cleanCompanyName(sup.name) : `미등록(${dCode})`; 
                        
                        const mgr = managersData.find(m => formatCode3(m.code) === dCode); 
                        if (mgr) {
                            const match = mgr.name.match(/(.+)\((.+)\)/);
                            if (match) {
                                const nameOnly = match[1].trim(); 
                                const email = match[2].trim(); 
                                mNameHtml = `<a href="https://teams.microsoft.com/l/chat/0/0?users=${email}" target="_blank" style="color:var(--primary); text-decoration:none; display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:white; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.1);">👨‍💼 ${nameOnly} 💬</a>`;
                            } else {
                                mNameHtml = `👨‍💼 ${mgr.name}`;
                            }
                        } else {
                            mNameHtml = `👨‍💼 미등록(${dCode})`;
                        }
                    } 

                    const oos = getOOSInfo(item.code);
                    let oosBadgeTitle = "";
                    let oosBottomInfo = "";

                    if (oos) {
                        const rawStatus = (oos.status || "품절").trim();
                        if (rawStatus.includes("중단")) {
                            oosBadgeTitle = `<span style="color:#64748B;">[⚫ 중단]</span> `;
                            oosBottomInfo = `<div style="margin-top: 12px; font-size: 0.85rem; color: #64748B; font-weight: 600;">🚫 판매중단 | 해지일정: ${oos.schedule || '해당없음'} ${oos.remark ? `| ${oos.remark}` : ''}</div>`;
                        } else {
                            oosBadgeTitle = `<span style="color:#DC2626;">[🔴 품절]</span> `;
                            oosBottomInfo = `<div style="margin-top: 12px; font-size: 0.85rem; color: #DC2626; font-weight: 600;">🚨 품절 | 해지일정: ${oos.schedule || '미정'} ${oos.remark ? `| ${oos.remark}` : ''}</div>`;
                        }
                    }

                    const targetCode = String(item.code).trim().padStart(6, '0');
                    const matchedNotice = noticeEntries.find(n => {
                        const codes = (n.pCode || '').split(',').map(c => c.trim().padStart(6, '0'));
                        return codes.includes(targetCode);
                    });
                    
                    let noticeBtnHtml = "";
                    if (matchedNotice && matchedNotice.content) {
                        let shortType = "보기"; 
                        const typeStr = matchedNotice.vCode || "";
                        
                        if (typeStr.includes('품절')) shortType = "품절";
                        else if (typeStr.includes('중단')) shortType = "중단";
                        else if (typeStr.includes('성상') && typeStr.includes('포장')) shortType = "성상·포장";
                        else if (typeStr.includes('성상') && typeStr.includes('규격')) shortType = "성상·규격";
                        else if (typeStr.includes('성상')) shortType = "성상";
                        else if (typeStr.includes('포장')) shortType = "포장";
                        else if (typeStr.includes('규격')) shortType = "규격";
                        
                        noticeBtnHtml = `<button class="notice-btn" onclick="openNoticeSearchPopup('${matchedNotice.id}')">📄 공문(${shortType})</button>`;
                    }

                    const matchedRecall = recallEntries.find(r => {
                        const codes = (r.pCode || '').split(',').map(c => c.trim().padStart(6, '0'));
                        return codes.includes(targetCode);
                    });

                    let recallBtnHtml = "";
                    let recallBottomInfo = "";
                    if (matchedRecall) {
                        recallBtnHtml = `<button class="recall-btn" onclick="openRecallSearchPopup('${matchedRecall.id}')">🚨 회수공문</button>`;
                        recallBottomInfo = `<div style="margin-top: 8px; font-size: 0.85rem; color: #E11D48; font-weight: 700;">🔄 회수진행 | 제조번호: ${matchedRecall.vCode || '하단 공문 참조'} | 종료일: ${matchedRecall.vName || '-'}</div>`;
                    }

                    const li = document.createElement('li');
                    li.onclick = function(e) {
                        if (e.target.closest('a') || e.target.closest('button')) return;
                        
                        document.getElementById('search-input').value = item.name;
                        list.style.display = 'none';
                    };

                    li.innerHTML = `
                        <div class="prod-name">${oosBadgeTitle}${item.name} ${noticeBtnHtml}${recallBtnHtml}</div>
                        <div class="prod-meta">코드: ${item.code} | 규격: ${item.spec || '-'}</div>
                        <div class="prod-info">🏢 ${sName} &nbsp;|&nbsp; ${mNameHtml}</div>
                        ${oosBottomInfo}
                        ${recallBottomInfo}
                    `;
                    list.appendChild(li);
                });
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            const input = document.getElementById('search-input');
            const list = document.getElementById('search-list');
            if (e.target !== input && e.target !== list && !list.contains(e.target)) {
                list.style.display = 'none';
            }
        });

        window.addEventListener('load', loadData);

        // 1. 일반 제약사공문 팝업 열기
        window.openNoticeSearchPopup = function(id) {
            const notice = noticeEntries.find(n => String(n.id) === String(id));
            if (notice && notice.content) {
                document.getElementById('notice-modal-title').innerText = `📢 [${notice.vCode || '공문'}] ${notice.vName || '제약사 공문'}`;
                document.getElementById('notice-modal-body').style.display = 'none';
                
                const imgEl = document.getElementById('notice-modal-img');
                imgEl.src = notice.content;
                imgEl.style.display = 'block';
                document.getElementById('notice-search-modal').style.display = 'flex';
            } else {
                alert("첨부된 공문 이미지가 없습니다.");
            }
        };

        // 2. 제약사회수 팝업 열기
        window.openRecallSearchPopup = function(id) {
            const item = recallEntries.find(r => String(r.id) === String(id));
            if (!item) return;

            const sup = item.supplierName && item.supplierName !== '-' ? item.supplierName : '';
            const fullProd = `${item.pName || ''} ${item.pSpec && item.pSpec !== '-' ? item.pSpec : ''}`.trim();
            const lot = item.vCode || '하단 공문 참조';
            const reason = item.regReason || '-';
            const endDate = item.vName || '-';

            document.getElementById('notice-modal-title').innerText = `🚨 [회수] ${sup} ${fullProd} 특정 제조번호 회수 건`;

            const bodyEl = document.getElementById('notice-modal-body');
            bodyEl.style.display = 'block';
            bodyEl.innerHTML = `
                <div><b>제약사 :</b> ${sup || '-'}</div>
                <div><b>제품명 :</b> ${fullProd}</div>
                <div><b>해당 제조번호 :</b> ${lot}</div>
                <div><b>회수사유 :</b> <span style="color:#E11D48; font-weight:700;">${reason}</span></div>
                <div><b>회수 시 요청사항 :</b> 회수처(약국 등) 상호인이 날인 된 회수확인서</div>
                <div><b>회수 시 유의사항 :</b> 특정제조번호 확인 및 해당제품 별도 반품요청</div>
                <div><b>회수종료일자 :</b> <strong style="color:#0F172A; text-decoration:underline;">${endDate}</strong> / 도착분에 한함.(이후 처리불가 할 수 있음)</div>
                <div style="margin-top:8px; font-weight:700; color:#475569;">## 관련부서의 적극적인 협조 부탁드립니다.</div>
            `;

            const imgEl = document.getElementById('notice-modal-img');
            if (item.content && item.content.startsWith('data:image')) {
                imgEl.src = item.content;
                imgEl.style.display = 'block';
            } else {
                imgEl.src = '';
                imgEl.style.display = 'none';
            }

            document.getElementById('notice-search-modal').style.display = 'flex';
        };

        // 공문 팝업 닫기
        window.closeNoticeSearchPopup = function() {
            document.getElementById('notice-search-modal').style.display = 'none';
        };

        // 이미지 원본 돋보기 팝업 열기
        window.openImageZoomPopup = function(src) {
            if (!src) return;
            document.getElementById('image-zoom-img').src = src;
            document.getElementById('image-zoom-modal').style.display = 'flex';
        };

        // 이미지 원본 돋보기 팝업 닫기
        window.closeImageZoomPopup = function() {
            document.getElementById('image-zoom-modal').style.display = 'none';
        };
    </script>
</body>
</html>
