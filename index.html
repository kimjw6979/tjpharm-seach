
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJPHARM-SEARCH🔍</title>
    
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        :root {
            --primary: #2563EB; 
            --primary-light: #EFF6FF; 
            --bg: #FFFFFF; 
            --text: #1E293B; 
            --text-light: #64748B; 
            --border: #E2E8F0;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%); 
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 12vh; 
            margin: 0;
            letter-spacing: -0.01em;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0F172A;
            margin-top: 0;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 0;
            font-weight: 500;
        }

        .search-container {
            width: 100%;
            max-width: 540px;
            position: relative;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            color: #94A3B8;
            pointer-events: none;
        }

        .search-input {
            width: 100%; 
            padding: 1.2rem 1.5rem 1.2rem 3.2rem; 
            border: 2px solid #DBEAFE; 
            border-radius: 16px; 
            font-size: 1.15rem; 
            box-sizing: border-box; 
            background-color: var(--bg); 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1); 
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .search-input:disabled {
            background-color: #F1F5F9;
            border-color: #CBD5E1;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .notice-box {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #B91C1C;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            margin-top: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.05);
        }

        .autocomplete-list { 
            position: absolute; 
            top: calc(100% + 8px); 
            left: 0; 
            right: 0; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            z-index: 1000; 
            max-height: 400px; 
            overflow-y: auto; 
            display: none; 
            box-shadow: var(--shadow-xl); 
            padding: 0; 
            margin: 0; 
            list-style: none; 
            border-radius: 12px; 
        }

        .autocomplete-list li { 
            padding: 16px 20px; 
            cursor: pointer; 
            border-bottom: 1px dashed var(--border); 
            transition: background 0.2s;
        }
        
        .autocomplete-list li:last-child { border-bottom: none; }
        .autocomplete-list li:hover { background-color: var(--primary-light); }

        .prod-name { font-size: 1.1rem; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
        .prod-meta { font-size: 0.8rem; color: #94A3B8; margin-bottom: 8px; font-weight: 500; }
        .prod-info { font-size: 0.9rem; color: var(--primary); font-weight: 700; background: #DBEAFE; display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; }
        
        .footer {
            margin-top: auto;
            padding: 2rem;
            color: #CBD5E1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="main-title">🇹🇯티제이팜 담당자 검색기💊</h1>
        <p class="sub-title">
            제조사와 실제 유통사가 달라서 헷갈리시나요?<br>
            <strong style="color: var(--primary);">실제 매입처</strong>와 <strong style="color: var(--primary);">담당자</strong>를 1초 만에 확인하세요!
        </p>
        <!-- 👇 스마트폰에서도 깔끔하게 보이도록 줄바꿈 및 스타일 최적화 👇 -->
        <div style="margin-top: 12px; padding: 0 10px;">
            <div style="display: inline-block; font-size: 0.85rem; color: #1D4ED8; background-color: #DBEAFE; padding: 8px 16px; border-radius: 12px; font-weight: 700; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1); line-height: 1.5; word-break: keep-all;">
                💡 검색된 [👨‍💼 이름 💬] 버튼을 누르면<br>팀즈 1:1 채팅이 열립니다!
            </div>
        </div>
    </div>

    <div class="search-container">
        <div class="input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="데이터를 불러오는 중입니다..." disabled autocomplete="off">
            <ul id="search-list" class="autocomplete-list"></ul>
        </div>
        
        <div class="notice-box">
            <span style="font-size: 1.3rem; margin-top: 2px;">⚠️</span>
            <div>
                <div style="margin-bottom: 8px;">본 검색기는 <strong>'매입처'</strong> 기준으로 담당자가 매칭됩니다.</div>
                <div style="color: #7F1D1D; font-size: 0.85rem; line-height: 1.6;">
                    일반의약품 검색 시 전문의약품 담당자가 표시될 수 있으므로,<br>
                    <strong>일반약 관련 문의는 전문 담당자에게 삼가주시기 바랍니다.</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        TJPHARM SEARCH SYSTEM
    </div>

    <script>
        let productsData = []; 
        let suppliersData = []; 
        let managersData = []; 

        function formatCode3(code) { 
            return code && /^\d+$/.test(code.trim()) ? code.trim().padStart(3, '0') : (code || ""); 
        }
        function cleanCompanyName(name) { 
            return name ? name.replace(/\(주\)/g, '').replace(/\(유\)/g, '').replace(/주식회사/g, '').trim() : ""; 
        }

        async function loadData() {
    try {
        // 🌟 헤더와 암호를 모두 지우고 주소만 깔끔하게 남깁니다.
        const res = await fetch('https://tjpharm2038-api.yellowcuppy.workers.dev/?action=getAll');
        
        const data = await res.json();
        // ... (아래 코드는 기존과 동일하게 유지) ...
                
                productsData = data.products || []; 
                suppliersData = data.suppliers || []; 
                managersData = data.managers || []; 

                const input = document.getElementById('search-input');
                input.placeholder = "제품명 또는 코드 입력 (예: 듀락칸)";
                input.disabled = false;
                input.focus();
            } catch (e) {
                console.error("데이터 로딩 실패:", e);
                document.getElementById('search-input').placeholder = "데이터를 불러오지 못했습니다.";
            }
        }

        document.getElementById('search-input').addEventListener('input', function() {
            const val = this.value.trim().toLowerCase().replace(/\^/g, ' '); 
            const list = document.getElementById('search-list');
            list.innerHTML = ''; 

            if (!val) { 
                list.style.display = 'none'; 
                return; 
            }

            const searchTerms = val.split(/\s+/).filter(t => t.length > 0); 

            // 1. 기존 필터링 (const를 let으로 변경하고 .slice는 잠시 뺍니다)
            let matches = productsData.filter(item => {
                if (!item || !item.standardCode || String(item.standardCode).trim() === "") return false;
                
                const code = String(item.code || '').toLowerCase();
                const name = String(item.name || '').toLowerCase();
                const spec = String(item.spec || '').toLowerCase();

                return searchTerms.every(term => 
                    code.startsWith(term) ||
                    name.includes(term) ||
                    spec.includes(term)
                );
            });

            // 🌟 2. [신규 추가] 검색어가 이름 앞부분에 있을수록 상단에 배치되도록 정렬
            if (searchTerms.length > 0) {
                const primaryTerm = searchTerms[0];
                matches.sort((a, b) => {
                    const nameA = String(a.name || '').toLowerCase();
                    const nameB = String(b.name || '').toLowerCase();
                    
                    const idxA = nameA.indexOf(primaryTerm);
                    const idxB = nameB.indexOf(primaryTerm);

                    // 둘 다 이름에 검색어가 포함된 경우
                    if (idxA !== -1 && idxB !== -1) {
                        // 검색어 위치가 더 앞쪽인 것을 최상단으로 (예: '이모튼'은 0번, '바이모'는 1번)
                        if (idxA !== idxB) return idxA - idxB; 
                        // 위치가 같다면 글자 길이가 더 짧은 것을 우선
                        return nameA.length - nameB.length;    
                    }
                    // 이름이 아니라 코드나 성분에만 일치한 경우는 뒤로 밀림
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return 0;
                });
            }

            // 3. 정렬이 끝난 후 상위 50개만 잘라서 화면에 표시
            matches = matches.slice(0, 50);

            if (matches.length > 0) {
                matches.forEach(item => {
                    let sName = "-"; 
                    let mNameHtml = "👨‍💼 -"; 

                    if (item.seller) { 
                        const dCode = formatCode3(item.seller); 
                        
                        const sup = suppliersData.find(s => formatCode3(s.code) === dCode); 
                        sName = sup ? cleanCompanyName(sup.name) : `미등록(${dCode})`; 
                        
                        const mgr = managersData.find(m => formatCode3(m.code) === dCode); 
                        if (mgr) {
                            // 🌟 이름 안에 괄호가 있는지 확인하고, 있으면 팀즈 링크로 변환합니다.
                            const match = mgr.name.match(/(.+)\((.+)\)/);
                            if (match) {
                                const nameOnly = match[1].trim(); 
                                const email = match[2].trim(); 
                                // 팀즈 채팅 딥링크 적용 (버튼 형태)
                                mNameHtml = `<a href="https://teams.microsoft.com/l/chat/0/0?users=${email}" target="_blank" style="color:var(--primary); text-decoration:none; display:inline-flex; align-items:center; gap:4px; padding:2px 8px; background:white; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.1);">👨‍💼 ${nameOnly} 💬</a>`;
                            } else {
                                // 괄호가 없으면 일반 텍스트로 표시
                                mNameHtml = `👨‍💼 ${mgr.name}`;
                            }
                        } else {
                            mNameHtml = `👨‍💼 미등록(${dCode})`;
                        }
                    } 

                    const li = document.createElement('li');
                    li.onclick = function(e) {
                        // 🌟 팀즈 링크(버튼)를 클릭했을 때는 드롭다운이 닫히지 않고 바로 넘어가도록 처리
                        if (e.target.closest('a')) return;
                        
                        document.getElementById('search-input').value = item.name;
                        list.style.display = 'none';
                    };

                    li.innerHTML = `
                        <div class="prod-name">${item.name}</div>
                        <div class="prod-meta">코드: ${item.code} | 규격: ${item.spec || '-'}</div>
                        <div class="prod-info">🏢 ${sName} &nbsp;|&nbsp; ${mNameHtml}</div>
                    `;
                    list.appendChild(li);
                });
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            const input = document.getElementById('search-input');
            const list = document.getElementById('search-list');
            if (e.target !== input && e.target !== list && !list.contains(e.target)) {
                list.style.display = 'none';
            }
        });

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
